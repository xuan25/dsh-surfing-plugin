# Select this bundle's providers while keeping DSH's native web_search and
# web_fetch tool schemas, output rendering, cancellation, and result limits.

- id: web
  config:
    searchProvider: surfing-searxng
    fetchProvider: surfing-crawl4ai

- insert:
    - id: surfing-plugin
      name: dsh-surfing-plugin

    # The Web app owns search inside each Agent Preset and disables the host
    # tool-web row; headless keeps that host search row enabled. A separate
    # fetch-only consumer therefore works in both profiles without duplicate
    # web_search registration.
    - id: surfing-tool-web-fetch
      name: '@deepseek-ai/dsh-tool-web'
      config:
        search: false
        fetch: true
        fetchTimeoutMs: 120000
        fetchMaxOutputChars: 200000
